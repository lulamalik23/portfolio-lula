<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR & VR Project | Lula</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
        }

        .project-detail {
            max-width: 1100px;
            margin: auto;
            padding: 70px 25px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 50px;
            color: #66bb6a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #a5d6a7;
            transform: translateX(-4px);
        }

        .project-label {
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 18px;
            color: #66bb6a;
            font-weight: 600;
        }

        .project-title {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 25px;
            max-width: 800px;
            color: #ffffff;
        }

        .project-description {
            max-width: 750px;
            font-size: 17px;
            line-height: 1.8;
            color: #bdbdbd;
            margin-bottom: 40px;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 60px;
        }

        .project-tech span {
            border: 1px solid #2e7d32;

            padding: 8px 14px;

            border-radius: 30px;

            font-size: 13px;
            color: #66bb6a;

            background: transparent;

            transition: all 0.3s ease;
        }

        .project-tech span:hover {
            background: #2e7d32;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .screenshots {
            display: flex;
            flex-direction: column;
            gap: 45px;
        }

        .screenshot-title {
            font-size: 14px;
            margin-bottom: 14px;
            color: #66bb6a;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .screenshot img {
            width: 100%;
            display: block;
            border-radius: 14px;
            border: 1px solid #333333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .project-footer {
            margin-top: 70px;
            padding-top: 30px;
            border-top: 1px solid #333333;
            color: #777777;
            font-size: 14px;
        }

        @media (max-width: 768px) {

            .project-detail {
                padding: 40px 20px;
            }

            .project-title {
                font-size: 36px;
            }

            .project-description {
                font-size: 15px;
            }

        }
    </style>
</head>

<body>

    <main class="project-detail">

        <a href="./projects/project-arvr.html" class="view-project">
            View Project
            <span>↗</span>
        </a>

        <p class="project-label">
            PROJECT 02 — AR & VR
        </p>

        <h1 class="project-title">
            Augmented Reality & Virtual Reality
        </h1>

        <p class="project-description">
            Proyek edukasi interaktif berbasis Augmented Reality
            dan Virtual Reality yang dikembangkan menggunakan
            Assemblr EDU.
        </p>

        <div class="project-tech">
            <span>Assemblr EDU</span>
            <span>AR</span>
            <span>VR</span>
        </div>

        <div class="screenshots">

            <div class="screenshot">

                <p class="screenshot-title">
                    01 — Project Preview
                </p>

                <img src="./images/project-arvr-1.png" alt="Project AR dan VR">
            </div>

            <div class="screenshot">

                <p class="screenshot-title">
                    02 — Project Preview
                </p>

                <img src="./images/project-arvr-2.png" alt="Project AR dan VR">
            </div>

        </div>

        <div class="project-footer">
            <p>Designed & Developed by Lula.</p>
        </div>

    </main>

</body>

</html>
